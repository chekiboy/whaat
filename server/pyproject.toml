[project]
name = "whaat"
version = "0.1.0"
description = "Whaat?! Not just an agent. An agent with a past."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "robert.kovacs", email = "robert.kovacs.ut@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162",
    "pydantic>=2.14",
    "typer>=0.27",
    "uvicorn>=0.54",
    "websockets>=17.4",
]

[project.scripts]
whaat = "whaat:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4",
    "pytest>=9.2",
    "ruff>=0.17",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
